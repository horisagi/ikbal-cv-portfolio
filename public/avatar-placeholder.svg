<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192c"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd7ba"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Circle with Tech Radial Glow -->
  <rect width="400" height="400" rx="200" fill="url(#bgGrad)"/>
  
  <!-- Subtle Background Rings / Digital Halo -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3" stroke-dasharray="8 6"/>
  <circle cx="200" cy="200" r="165" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.2"/>

  <!-- Tech Network Nodes in Background -->
  <g opacity="0.25" stroke="#38bdf8" stroke-width="1.5">
    <line x1="80" y1="120" x2="140" y2="90"/>
    <line x1="140" y1="90" x2="200" y2="60"/>
    <line x1="200" y1="60" x2="260" y2="90"/>
    <line x1="260" y1="90" x2="320" y2="120"/>
    <circle cx="80" cy="120" r="4" fill="#38bdf8"/>
    <circle cx="140" cy="90" r="4" fill="#38bdf8"/>
    <circle cx="200" cy="60" r="5" fill="#38bdf8"/>
    <circle cx="260" cy="90" r="4" fill="#38bdf8"/>
    <circle cx="320" cy="120" r="4" fill="#38bdf8"/>
  </g>

  <!-- Upper Body / Suit & Tie (Clean Professional Outfit) -->
  <path d="M70 400 C80 320 130 280 200 280 C270 280 320 320 330 400 Z" fill="url(#suitGrad)"/>
  
  <!-- Shirt Collar White -->
  <polygon points="175,280 200,325 180,350 160,285" fill="#f8fafc"/>
  <polygon points="225,280 200,325 220,350 240,285" fill="#e2e8f0"/>
  
  <!-- Light Blue Professional Tie -->
  <polygon points="194,320 206,320 210,380 200,400 190,380" fill="#0284c7"/>
  <polygon points="192,315 208,315 204,328 196,328" fill="#0369a1"/>

  <!-- Neck -->
  <rect x="182" y="225" width="36" height="60" rx="10" fill="#fbcfe8"/>
  <path d="M182 250 Q200 268 218 250 L218 285 L182 285 Z" fill="#f472b6" opacity="0.15"/>

  <!-- Head / Face -->
  <ellipse cx="200" cy="190" rx="55" ry="65" fill="#fed7aa"/>

  <!-- Ears -->
  <ellipse cx="143" cy="192" rx="10" ry="16" fill="#fcd34d" opacity="0.9"/>
  <ellipse cx="257" cy="192" rx="10" ry="16" fill="#fcd34d" opacity="0.9"/>

  <!-- Modern Hair Style -->
  <path d="M142 180 C140 130 165 110 200 110 C240 110 260 135 258 180 C250 145 225 130 200 135 C175 140 155 155 142 180 Z" fill="url(#hairGrad)"/>

  <!-- Eyes & Eyebrows (Approachable, confident look) -->
  <path d="M172 165 Q182 162 190 166" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M210 166 Q218 162 228 165" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <ellipse cx="181" cy="177" rx="4.5" ry="5.5" fill="#0f172a"/>
  <circle cx="183" cy="175" r="1.5" fill="#ffffff"/>
  <ellipse cx="219" cy="177" rx="4.5" ry="5.5" fill="#0f172a"/>
  <circle cx="221" cy="175" r="1.5" fill="#ffffff"/>

  <!-- Gentle Smile -->
  <path d="M186 215 Q200 228 214 215" stroke="#be185d" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- Subtle Glasses (Optional smart tech look) -->
  <rect x="165" y="166" width="30" height="22" rx="6" fill="none" stroke="#0284c7" stroke-width="2.2" opacity="0.85"/>
  <rect x="205" y="166" width="30" height="22" rx="6" fill="none" stroke="#0284c7" stroke-width="2.2" opacity="0.85"/>
  <line x1="195" y1="175" x2="205" y2="175" stroke="#0284c7" stroke-width="2.2" opacity="0.85"/>

  <!-- Professional Badge Pill at bottom -->
  <g transform="translate(110, 355)">
    <rect width="180" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" filter="url(#softGlow)"/>
    <circle cx="20" cy="17" r="5" fill="#10b981"/>
    <text x="32" y="21" fill="#f8fafc" font-family="Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="1">IKBAL ABI P.</text>
  </g>
</svg>
