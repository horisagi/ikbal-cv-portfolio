                  <h3 className="text-xs font-black uppercase tracking-wider border-b border-slate-300 pb-1 mb-2">PENDIDIKAN FORMAL</h3>

                    {education.map((edu, idx) => (
                      <div key={idx} className="flex justify-between text-xs">
                        <div>
                          <div className="font-bold text-slate-900">{edu.institution}</div>
                          <div className="text-blue-700 font-semibold">{edu.major}</div>
                        </div>
                        <div className="font-mono font-semibold text-slate-500">{edu.period}</div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="mb-5 grid grid-cols-2 gap-4">
                  <div>
                    <h3 className="text-xs font-black uppercase tracking-wider border-b border-slate-300 pb-1 mb-2">KEAHLIAN TEKNIS</h3>
                    <ul className="text-xs space-y-1 text-slate-700">
                      {skills.technical.map((s, i) => (
                        <li key={i} className="flex justify-between">
                          <span>• {s.name}</span>
                          <span className="font-mono">{s.level}%</span>
                        </li>
                      ))}
                    </ul>
                  </div>
                  <div>
                    <h3 className="text-xs font-black uppercase tracking-wider border-b border-slate-300 pb-1 mb-2">SOFT SKILLS</h3>
                    <ul className="text-xs space-y-1 text-slate-700">
                      {skills.soft.map((s, i) => (
                        <li key={i}><span className="font-bold">• {s.name}:</span> {s.description}</li>
                      ))}
                    </ul>
                  </div>
                </div>

                <div>
                  <h3 className="text-xs font-black uppercase tracking-wider border-b border-slate-300 pb-1 mb-2">PROYEK TERKAIT</h3>
                  <div className="grid grid-cols-2 gap-3 text-xs">
                    {projects.slice(0, 2).map((p) => (
                      <div key={p.id} className="p-2 border rounded bg-slate-50">
                        <div className="font-bold">{p.title}</div>
                        <div className="text-[11px] text-blue-700">{p.technologies.join(', ')}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // MAIN APP
    function App() {
      const [darkMode, setDarkMode] = useState(true);
      const [isCVModalOpen, setIsCVModalOpen] = useState(false);
      const [selectedProject, setSelectedProject] = useState(null);

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      return (
        <div className={`min-h-screen ${darkMode ? 'bg-slate-950 text-slate-100' : 'bg-white text-slate-900'}`}>
          <Navbar darkMode={darkMode} setDarkMode={setDarkMode} onOpenCVModal={() => setIsCVModalOpen(true)} />
          <main>
            <Hero darkMode={darkMode} onOpenCVModal={() => setIsCVModalOpen(true)} />
            <About darkMode={darkMode} />
            <Education darkMode={darkMode} />
            <Skills darkMode={darkMode} />
            <Experience darkMode={darkMode} />
            <Projects darkMode={darkMode} onSelectProject={(p) => setSelectedProject(p)} />
            <Contact darkMode={darkMode} />
          </main>
          <footer className="py-8 text-center text-xs text-slate-500 border-t border-slate-800">
            &copy; {new Date().getFullYear()} Ikbal Abi Pamungkas. All rights reserved.
          </footer>
          <CVModal isOpen={isCVModalOpen} onClose={() => setIsCVModalOpen(false)} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
